version: '3.8'
services:
  redis:
    image: redis:7.2
    ports:
      - '6379:6379'
  backend:
    build: .
    # Use python -m uvicorn to ensure uvicorn runs with the container's Python environment
    command: python -m uvicorn backend.app:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - '8000:8000'
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
    depends_on:
      - redis
  celery:
    build: .
    # Use python -m celery to ensure the celery CLI runs with the container's Python
    command: python -m celery -A backend.celery_app.celery_app worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
    depends_on:
      - redis
  frontend:
    build: ./frontend
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=production
    depends_on:
      - backend
